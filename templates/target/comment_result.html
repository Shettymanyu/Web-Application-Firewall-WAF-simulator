<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comment — Target App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <nav class="border-b border-gray-800 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="/target" class="text-gray-400 hover:text-white text-sm">← Target App</a>
      <span class="text-gray-700">/</span>
      <span class="font-semibold text-sm">Comment</span>
    </div>
    <a href="/dashboard" class="text-xs bg-blue-700 hover:bg-blue-600 px-3 py-1.5 rounded-lg transition-colors">WAF Dashboard →</a>
  </nav>
  <div class="max-w-2xl mx-auto px-4 py-10">
    <div class="bg-green-900/30 border border-green-700 rounded-xl p-4 text-sm">
      <div class="font-bold text-green-400 mb-2">✅ Comment posted (WAF allowed it)</div>
      <div class="font-mono text-xs bg-gray-900 px-4 py-3 rounded-lg text-gray-300">{{ comment | e }}</div>
    </div>
    <div class="mt-4">
      <a href="/target" class="text-blue-400 hover:text-blue-300 text-sm">← Back to Target App</a>
    </div>
  </div>

</html>
